name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # hdsim is not on PyPI yet, so the method core is installed from source. Tracking main is
  # deliberate: these packages are meant to work together, so a core change that breaks a domain
  # should turn this red rather than wait to be discovered. Switch to a released version once
  # hdsim is published.
  HDSIM_CORE: "hdsim @ git+https://github.com/HDSim-AI/hdsim@main"

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install "$HDSIM_CORE"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  wheel:
    name: wheel installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      # Regression guard. attitudinal_markers.json is read at import time; before 2026-08-06 it
      # was not declared as package-data, so `import hdsim.travel` raised FileNotFoundError on a
      # real install. Editable installs never caught it because the file sits in the source tree.
      # This step installs the built wheel and imports it from outside the repo.
      - name: Import the built wheel from outside the repo
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$HDSIM_CORE"
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/python -c "import hdsim.core, hdsim.travel; from hdsim.travel import load_example; print(len(load_example().members), 'members')"
