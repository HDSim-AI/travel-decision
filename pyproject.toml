[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdsim-travel"
version = "0.1.0.dev0"
description = "Household travel decisions for hdsim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hdsim>=0.1.0.dev0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/HDSim-AI"
Source = "https://github.com/HDSim-AI/travel-decision"
Paper = "https://arxiv.org/abs/2604.10475"

[tool.setuptools.packages.find]
include = ["hdsim*"]

# attitudinal_markers.json is read at import time by config.py. Without this it is left out of the
# wheel and `import hdsim.travel` raises FileNotFoundError on a non-editable install.
[tool.setuptools.package-data]
"hdsim.travel" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
